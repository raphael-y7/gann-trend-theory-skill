    / 十二条规则与资金管理 twelve-trading-rules-skill / 买卖点位与时机 entry-exit-timing-skill / 失败模式排障 failure-mode-triage-skill）的触发范围时使用。覆盖：市场整体处于高位还是低位、能否抄底（七个行动区域）；浮盈后怎样逐档顺势加码（金字塔加码）；某条股息/增发/突发消息该买该卖（消息贴现）；怎样建立不盯盘的复盘记录流程（看盘工作流）；年度持仓体检与高息预警（持仓体检）；以及本书术语、概览与决策规则速查类查询。不适用于：通用财经问答、基本面估值建模、日内高频交易、具体未来点位预测。
