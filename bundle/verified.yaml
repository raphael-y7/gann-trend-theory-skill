entry:
  name: gann-trend-theory-skill
  description: 当用户带着《江恩股市趋势理论》（威廉·D.江恩，New Stock Trend Detector，正文1923年）的方法论做股票投资分析时使用：判断趋势与顶底结构（多周期图表、累进高低位、突破旧位）、复盘支撑阻力并锚定止损、识别吸筹/派发（量价×区间×时间）、七个行动区域定位、强弱判别与选股（相对强度、突破上年高点名单）、十二条交易规则与资金管理、金字塔加码、买卖点位与时机、消息贴现处理、看盘复盘工作流、失败模式排障、持仓年度体检。适用问题如“这波是吸筹还是出货”“止损设哪”“该不该追新高”“这条消息怎么解读”“仓位怎么管理”“我又亏了，错在哪”。不适用于：与本方法论无关的通用财经问答、基本面估值建模（原书明确否定账面价值路线）、日内高频交易执行、具体未来点位预测（时间周期算法原书未公开且不可检验）。
  core_principles:
  - 价格由供求决定；大行情前必有长时间的吸筹或派发，痕迹留在价位区间、时间、成交量三者上。
  - 趋势=顶底节节抬高/降低；月周定方向、日线只择时；突破旧位入新区间，二次新高比第一次更安全。
  - 每笔交易必须挂止损单：旧底下方3点/旧顶上方1—3点，G.T.C.，绝不取消或放宽，浮盈后上移保护利润；三大致命错误=过度交易、不下止损单、摊薄亏损。
  - 顺势而为：熊市反弹做空、牛市回挡做多；拿不准就退出。
  - 金字塔加码逐级减量（100→50→30→20→10）、只顺浮盈方向；吸筹派发区内禁止加码。
  - 消息几乎总是已被贴现：利好出现而股价下跌=已贴现；图表与消息抵触时信图表。
  - 固定点数参数绑定1920年代价位，用于现代市场前必须按波动率/流通盘归一化（换算非原书内容）。
  out_of_scope:
  - 与本书方法论无关的通用财经问答与基本面估值建模（原书否定账面价值路线）
  - 日内高频交易执行与具体未来点位预测（时间周期算法原书未公开）
  - 期货专有操作细则（交割选择、季节性等仅作参考域）
  stop_conditions:
  - 用户要求保证盈利或确定点位预测时：声明本方法论无统计检验、作者断言不可证伪，不提供保证。
  - 拒绝把1920年代固定点数（3-5点止损、5-7点回调等）直接套用于现代市场，必须先归一化并声明换算为整理者补丁。
  - 吸筹/派发判断在现代市场只能作证据强度评估（量价可被伪造的前提差异），不得当作确定结论。
  - 原书数据存在两写矛盾（如鲍德温62.375年份、小麦126.875/126.75），引用时按“原文两写”呈现，不得静默采信一方。
  - 路由顺序：先检查本节与 out_of_scope（拒答类），再匹配能力意图；凡含“预测点位/保证盈利”类请求直接触发第一条判停，不进入能力匹配。
  - 复合意图句（如“止损设哪+拿多少钱买”）按主从裁决：资金/仓位类主卡 twelve-trading-rules-skill，点位/止损类主卡 support-resistance-stops-skill，其余能力经 also_read
    级联，单次任务最多加载 2 张卡。
