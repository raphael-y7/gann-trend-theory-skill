capabilities:
- capability_id: cap.gann-trend-theory-skill.trend-judgment-skill
  revision: 1
  status: active
  slug: trend-judgment-skill
  title: 趋势判断（多周期+累进高低位+突破旧位）
  importance: high
  importance_rationale: 判势是全书核心任务与一切买卖决策的前提，第10/12/20/22章主体篇幅均归此卡。
  one_liner: 月/周定方向、日仅择时；顶底节节抬高为涨势，破旧位入新区间，二次新高更安全。
  intents:
  - 判断这只股票/指数现在是涨势还是跌势
  - 横盘很久突然放量突破，是不是大行情起点
  - 创新高能追吗，会不会是假突破
  - 月线周线日线信号矛盾该信哪个
  - 复盘高低点序列给个股画趋势结构
  keywords:
  - 趋势判断
  - 多周期图表
  - 累进高低位
  - 突破旧位
  - 新区间
  - 假突破
  - 双重顶
  - 三重底
  - 扁平顶
  - 陡直顶
  card: cards/trend-judgment-skill.md
  promotion:
    destination: promoted
  also_read:
  - support-resistance-stops-skill
  - accumulation-distribution-skill
  - seven-action-zones
  frontmatter:
    description: 用多周期图表体系（月/周/日三层）+累进高低位+突破旧位判定股票、板块或指数的趋势方向。当用户问“这是涨势还是跌势”、突破是不是大行情起点、创新高能追吗/是否假突破、月线周线日线矛盾听谁时使用。不用于找具体买卖位与止损（support-resistance-stops-skill）、判区间是吸筹还是派发（accumulation-distribution-skill）、判价格位置贵贱（seven-action-zones）；不做日内择时，不预测具体未来点位（原书时间周期算法不可得）。
- capability_id: cap.gann-trend-theory-skill.support-resistance-stops-skill
  revision: 1
  status: active
  slug: support-resistance-stops-skill
  title: 支撑/阻力复盘与止损体系
  importance: high
  importance_rationale: 对应第8章风险限定规则与第22章突破体系；不下止损单为作者三大致命错误之二，本卡是全系统唯一的风控执行件。
  one_liner: 旧底下方3点/旧顶上方1—3点挂G.T.C.止损；绝不取消放宽，浮盈止损上移保本。
  intents:
  - 这笔交易的止损设在哪儿、放多宽
  - 这个价位是支撑还是阻力、破了怎么办
  - 浮盈了怎么用移动止损保护利润
  - 被止损出局后什么条件可以再入场
  - 这个关键位历史上被测试过几次
  keywords:
  - 支撑
  - 阻力
  - 止损
  - 止损单
  - G.T.C.
  - 移动止损
  - 旧高旧低
  - 假突破
  - 双顶双底
  card: cards/support-resistance-stops-skill.md
  promotion:
    destination: promoted
  also_read:
  - trend-judgment-skill
  - accumulation-distribution-skill
  - pyramid-scaling
  frontmatter:
    description: 方向已知时，用多年旧高低位复盘确定支撑/阻力，锚定止损（旧底下方3点/旧顶上方1—3点、G.T.C.、绝不取消或放宽），管理移动止损（先推保本再跟进）与止损后再入场。当用户问“止损设哪”“这是支撑还是阻力”“怎么锁定利润”“被止损了还能再进吗”时使用。不判趋势方向（trend-judgment-skill）、不判区间吸筹派发性质（accumulation-distribution-skill）、不承担资本分档计算；时间止损原书未量化，破位目标推算仅为个案演算。
- capability_id: cap.gann-trend-theory-skill.accumulation-distribution-skill
  revision: 1
  status: active
  slug: accumulation-distribution-skill
  title: 吸筹/派发识别（量价×区间×时间三维）
  importance: high
  importance_rationale: 对应全书主旨命题（供求留痕、吸筹派发可由量价区间时间反推），第10/12/14/20/21章篇幅最大。
  one_liner: 量除以股本看换手；低位窄幅小量=吸筹，高位大量反复=派发，天量+利好=行情结束。
  intents:
  - 这只票横盘数月，是在吸筹还是派发/洗盘还是出货
  - 放量滞涨、单周天量还能拿吗
  - 高位宣布增加股息/额外派息意味着什么
  - 连跌后缩量横盘，抛压是否枯竭、能不能进场
  - 用成交量和流通股本独立核验主力出货说法
  keywords:
  - 吸筹
  - 派发
  - 出货
  - 换手率
  - 区间震荡计数
  - 天量
  - 缩量见底
  - 放量滞涨
  card: cards/accumulation-distribution-skill.md
  promotion:
    destination: promoted
  also_read:
  - trend-judgment-skill
  - seven-action-zones
  - support-resistance-stops-skill
  frontmatter:
    description: 以成交量÷流通股本为基准，结合区间震荡计数（5点级往返10—20次）、持续时间与位置语境，判别横盘区间是吸筹还是派发；识别天量转折、单周天量+大利好=结束、缩量见底=抛压枯竭等信号。当用户问“这是吸筹还是派发”“洗盘还是出货”“地量是不是见底”“高位利好是不是诱饵”时使用。边界：1920年代量价不可伪造前提现代不严格成立，结论只能作证据强度评估；不判趋势方向、不给买卖位。
- capability_id: cap.gann-trend-theory-skill.seven-action-zones
  revision: 1
  status: active
  slug: seven-action-zones
  title: 七个行动区域位置判别
  importance: medium
  importance_rationale: 独立位置框架但仅第11章一章篇幅；信号可机械执行而中枢判定主观、案例仅指数级2例。
  one_liner: 以正常区域为中枢分七区；上3区无消息低开=饱和退出，下3区停止做空等吸筹。
  intents:
  - 现在市场是高位还是低位、贵不贵
  - 涨了这么多是不是过热、该不该清仓
  - 跌成这样是不是底部区域、能开始抄底吗
  - 无消息跳空低开、利好频出说明什么
  - 给仓位决策定一个贪婪/恐惧的位置语境
  keywords:
  - 七个行动区域
  - 正常区域
  - 顶部区域
  - 底部区域
  - 饱和点
  - 恐慌区
  - 过热
  - 抄底
  card: cards/seven-action-zones-skill.md
  promotion:
    destination: router
  also_read:
  - trend-judgment-skill
  - accumulation-distribution-skill
  frontmatter:
    description: 以正常区域（内在价值附近）为中枢把价格位置分为上下各三个行动区域，输出当前处于第几区及对应行动规则。当用户问“现在是高位还是低位”“市场过热了吗、能抄底吗”“无消息低开说明什么”时使用。边界：区域中枢判定主观、原书无算法，现代估值分位近似为整理者补丁非原书内容；只给位置语境，不判方向、不给止损位。
- capability_id: cap.gann-trend-theory-skill.strength-based-selection-skill
  revision: 1
  status: active
  slug: strength-based-selection-skill
  title: 强弱判别与选股
  importance: high
  importance_rationale: 第16-19、22章整章支撑的标的选择层；选错标的使全套趋势判断失效，是买卖什么的一票否决环节。
  one_liner: 只做活跃领头股：大盘弱它强＝强，破上年高点者领涨；卖弱买强，空股选深跌低价股。
  intents:
  - 在候选股票池里筛选最强/最弱标的并排序
  - 按突破上年高点（52周新高）做年度动量名单
  - 判断某股相对大盘/板块是强是弱、要不要换仓
  - 为做空筛选安全标的
  - 识别新股、昔日领头股、攻旧高不克等选股陷阱
  keywords:
  - 强弱判别
  - 相对强度
  - 领头股
  - 板块轮动
  - 52周新高
  - 卖弱买强
  - 落伍者
  - 做空筛选
  - 新股风险
  card: cards/strength-based-selection-skill.md
  promotion:
    destination: promoted
  also_read:
  - trend-judgment-skill
  - accumulation-distribution-skill
  - entry-exit-timing-skill
  frontmatter:
    description: 当用户在候选股票池中问“哪只最强/最弱、先买哪个”、按突破上年高点筛领涨者、判断个股相对大盘强弱或为做空挑安全标的时使用。只做横截面强弱排序（卖弱买强），不判断单只标的方向（趋势判断）、不给出买卖点位与仓位；附带新股、昔日领头股、攻旧高不克的陷阱识别。
- capability_id: cap.gann-trend-theory-skill.twelve-trading-rules-skill
  revision: 1
  status: active
  slug: twelve-trading-rules-skill
  title: 十二条交易规则与资金管理
  importance: critical
  importance_rationale: 第8章为全书核心章，12条规则是资金与纪律的总量约束层；三大致命错误直接导致破产，其余能力的执行都以本卡额度为前提。
  one_liner: 先定资本分档与单笔风险上限，再避三大致命错误与15条禁令，连亏五到十次仍能交易。
  intents:
  - 制定仓位与资金管理计划（买多少、一次最多亏多少）
  - 设计跨类别4-5只等量的分散持股组合
  - 排查过度交易/摊薄亏损/无止损等致命行为
  - 评估是否应为分红买进或持有高息股
  - 连续亏损后判断能否继续交易与扩大规模
  keywords:
  - 资金管理
  - 仓位
  - 十二条交易规则
  - 止损额度
  - 均摊风险
  - 过度交易
  - 摊薄亏损
  - 累积盈余
  - 禁止清单
  - 为分红买进
  card: cards/twelve-trading-rules-skill.md
  promotion:
    destination: promoted
  also_read:
  - support-resistance-stops-skill
  - pyramid-scaling
  - portfolio-annual-checkup
  frontmatter:
    description: 当用户制定仓位与资金管理计划、连续亏损后评估能否继续交易、或想把高息分红当作买进理由时使用；并用于排查过度交易、不下止损、摊薄亏损三大致命错误。只管总量与纪律层——止损挂法、买卖点位、加码节奏分别由止损卡、买卖点位卡、金字塔卡承接。
- capability_id: cap.gann-trend-theory-skill.pyramid-scaling
  revision: 1
  status: active
  slug: pyramid-scaling
  title: 金字塔式加码
  importance: high
  importance_rationale: 第9章核心操作方法，决定利润放大与风险前移结构；误用则全数回吐。
  one_liner: 顺势加码逐级减量100→50→30→20→10，每档止损跟进；区间内与近顶近底禁止。
  intents:
  - 制定顺势金字塔加码计划（数量序列与间隔）
  - 判断是否具备加码资格（脱离吸筹/派发区、首次转向）
  - 区分顺势加码与摊薄亏损（浮亏加码一律否决）
  - 设定每档加码的止损跟进与停止条件
  keywords:
  - 金字塔加码
  - 顺势加仓
  - 递减加码
  - 浮盈加仓
  - 摊薄亏损
  - 吸筹派发区
  - 移动止损
  - 加码间隔
  card: cards/pyramid-scaling-skill.md
  promotion:
    destination: router
  also_read:
  - support-resistance-stops-skill
  - twelve-trading-rules-skill
  - failure-mode-triage-skill
  frontmatter:
    description: 当用户已有浮盈问“要不要加仓、加多少、间隔多大”，或想区分顺势金字塔加码与摊薄亏损时使用。只在走出吸筹/派发区或长期运动后首次转向时启动，逐级减量（100→50→30→20→10）并每档止损跟进；亏损方向追加（摊薄）、吸筹派发区内与近顶近底加码一律拒绝。期货加码参数属参考域R，仅限期货语境引用。
- capability_id: cap.gann-trend-theory-skill.entry-exit-timing-skill
  revision: 1
  status: active
  slug: entry-exit-timing-skill
  title: 买卖点位与时机
  importance: critical
  importance_rationale: 书名趋势探测器的直接执行层（何时买卖）；方向对但位置节奏错仍亏钱。承载拿不准就退出的时间参数缺口处置。
  one_liner: 高于底10点买、距顶10点卖不设目标价；启动即上车，两天回调买，拿不准就退。
  intents:
  - 判断当前应买入、卖出还是等待的位置
  - 制定极端位后两日回调买进计划
  - 决定行情启动时是否立即追入（不等回落）
  - 用获利四问决定是否止盈、拒绝预设目标价
  - 大利润后执行作壁上观空仓纪律
  keywords:
  - 买卖点位
